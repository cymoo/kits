<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会话</title>
<script src="./runtime.js"></script>
<script src="./theme.js"></script>
<script src="./shell.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F9F9F8}
a{color:#3563E0}a:hover{color:#2A4FBF}
.k-ghost:hover{background:#F1F1EE}
.k-row:hover{background:#FFFFFF;box-shadow:0 0 0 1px #E8E8E5}
@keyframes k-pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</helmet>
<div style="height: 100vh; display: flex; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; color: #16171A; font-size: 14px; line-height: 22px; background: #F9F9F8; overflow: hidden">

  <k-nav active="history"></k-nav>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; padding: 32px 40px; box-sizing: border-box">
    <div style="width: 100%; max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">会话</h1>
        <span style="font-size: 13px; color: #60646B">本机共 38 个 · 数据只存在这台电脑上</span>
        <span style="flex: 1"></span>
        <button type="button" onClick="{{openPalette}}" class="k-ghost" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid #E8E8E5; border-radius: 8px; background: #FFFFFF; font: inherit; color: #60646B; cursor: pointer; min-width: 240px; text-align: left"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg><span style="flex: 1">搜会话内容、文件名、需求号…</span><span style="font-size: 12px; color: #A0A3A9">⌘K</span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{filters}}" as="ft"><button type="button" onClick="{{ft.pick}}" aria-pressed="{{ft.on}}" style="{{ft.style}}">{{ft.label}}</button></sc-for>
        <span style="width: 1px; height: 18px; background: #E8E8E5; margin: 0 4px"></span>
        <button type="button" aria-haspopup="menu" class="k-ghost" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid #E8E8E5; border-radius: 13px; background: #FFFFFF; font: inherit; font-size: 13px; color: #16171A; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4.5h4l1.5 1.5H14v7H2z"></path></svg>所有工作区<svg aria-hidden="true" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"></path></svg></button>
        <button type="button" aria-haspopup="menu" class="k-ghost" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid #E8E8E5; border-radius: 13px; background: #FFFFFF; font: inherit; font-size: 13px; color: #16171A; cursor: pointer">所有 Agent<svg aria-hidden="true" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"></path></svg></button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{groups}}" as="g">
          <span style="font-size: 12px; font-weight: 500; color: #84878E; padding: 10px 6px 2px">{{g.label}}</span>
          <sc-for list="{{g.rows}}" as="r">
            <a href="{{r.href}}" class="k-row" style="display: grid; grid-template-columns: 16px minmax(0, 1fr) 140px 110px 90px; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 12px; text-decoration: none; color: #16171A">
              <span aria-hidden="true" style="{{r.dot}}"></span>
              <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}}</span><span style="font-size: 13px; color: #60646B; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.sub}}</span></span>
              <span style="font-size: 13px; color: #60646B; font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.dir}}</span>
              <span style="{{r.stateStyle}}">{{r.state}}</span>
              <span style="font-size: 13px; color: #84878E; text-align: right">{{r.when}}</span>
            </a>
          </sc-for>
        </sc-for>
        <sc-if value="{{empty}}"><div style="padding: 40px; text-align: center; color: #60646B">没有符合条件的会话</div></sc-if>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const s = this.state;
    const dot = (c, pulse) => 'width: 7px; height: 7px; border-radius: 50%; background: ' + (c || 'transparent') + (pulse ? '; animation: k-pulse 1.4s ease-in-out infinite' : '');
    const colors = { run: '#2A4FBF', wait: '#8A5A00', err: '#9A2C1F', done: '#60646B', idle: '#60646B' };
    const row = (href, title, sub, dir, kind, state, when, dotColor, pulse) => ({ href, title, sub, dir, kind, state, when, dot: dot(dotColor, pulse), stateStyle: 'font-size: 13px; font-weight: 500; color: ' + colors[kind] });
    const all = [
      ['置顶', [
        row('session.html?s=context', '梳理会员等级规则', '上下文接近上限', 'member-svc', 'idle', '空闲', '1 小时前', null)
      ]],
      ['今天', [
        row('session.html?s=streaming', '给兑换接口加幂等校验', '改了 5 个文件 · 16 个测试通过', 'member-svc', 'run', '运行中', '刚刚', '#3563E0', true),
        row('session.html?s=permission', '给兑换接口加幂等校验', '有一条命令等你确认', 'member-svc', 'wait', '待确认', '12 分钟前', '#B4650A'),
        row('session.html?s=question', '排查订单退款超时', '没有改文件', 'order-svc', 'wait', '有提问', '12 分钟前', '#B4650A')
      ]],
      ['昨天', [
        row('session.html?s=error', '生成积分模块接口文档', '网关断连重试中 / 内核退出', 'member-svc', 'err', '出错', '昨天 14:05', '#C8381F'),
        row('session.html?s=output', '接口文档和实现对不上的地方', 'api-reviewer · 产出 7 条，可逐条审核导出', 'member-svc', 'done', '已完成', '昨天 11:20', null),
        row('session.html?s=done', '优惠券过期任务为什么没跑', '结论：cron 表达式时区写错', 'points-web', 'done', '已完成', '昨天 09:48', null)
      ]],
      ['本周', [
        row('session.html?s=changes', '把 order-svc 的日志改成 JSON', '改了 11 个文件（改动面板放大）', 'order-svc', 'done', '已完成', '周一', null),
        row('session.html?s=done', '会员等级是怎么升降的', '问答', 'member-svc', 'done', '已完成', '周一', null)
      ]]
    ];
    const keep = (r) => s.filter === 'all' || (s.filter === 'active' && (r.kind === 'run' || r.kind === 'wait')) || (s.filter === 'wait' && r.kind === 'wait') || (s.filter === 'done' && r.kind === 'done');
    const groups = all.map(([label, rows]) => ({ label, rows: rows.filter(keep) })).filter((g) => g.rows.length);
    const filters = [['all', '全部'], ['active', '进行中'], ['wait', '等我处理'], ['done', '已完成']].map(([k, label]) => {
      const on = s.filter === k;
      return { label, on, pick: () => this.setState({ filter: k }), style: 'height: 26px; padding: 0 10px; border: 1px solid ' + (on ? '#16171A' : '#E8E8E5') + '; border-radius: 13px; background: ' + (on ? '#16171A' : '#FFFFFF') + '; font: inherit; font-size: 13px; color: ' + (on ? '#FFFFFF' : '#16171A') + '; cursor: pointer' };
    });
    return { groups, filters, empty: !groups.length, openPalette: () => window.kitsPalette.open() };
  }
}
</script>
</body>
</html>
