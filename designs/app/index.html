<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>kits</title>
<script src="./runtime.js"></script>
<script src="./shell.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F2}
a{color:#3659E3}a:hover{color:#2744B8}
.k-sug:hover{border-color:#C9C8C1;background:#FFFFFF}
.k-recent:hover{background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px #E5E4DF}
@keyframes k-pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</helmet>
<div style="height: 100vh; display: flex; font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #1B1B1F; font-size: 13px; line-height: 1.5; background: #F6F5F2; overflow: hidden">

  <k-nav active="new"></k-nav>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 0 32px; box-sizing: border-box">
    <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 28px; margin: 148px 0 48px">
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.015em">要做什么？</h1>
        <p style="margin: 0; color: #6E6E76">在 <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #1B1B1F">member-svc</span> 里干活。输入 / 用命令，@ 引用文件、需求或用例。</p>
      </div>

      <k-composer key="home" rows="3" big placeholder="描述任务。例如：给积分兑换接口加幂等校验，改完跑 tests/points 下的测试"></k-composer>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
        <sc-for list="{{suggestions}}" as="g">
          <button type="button" onClick="{{g.pick}}" class="k-sug" style="height: 32px; padding: 0 12px; border: 1px solid #E5E4DF; border-radius: 16px; background: transparent; font: inherit; font-size: 12.5px; color: #4A4A52; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><span style="color: #9A9AA1">{{g.kind}}</span>{{g.text}}</button>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px">
        <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 4px">
          <span style="font-size: 12px; font-weight: 500; color: #8A8A92">继续上次</span>
          <span style="flex: 1"></span>
          <a href="history.html" style="font-size: 12px; text-decoration: none">全部会话</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{recent}}" as="r">
            <a href="{{r.href}}" class="k-recent" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; text-decoration: none; color: #1B1B1F; min-height: 92px; box-sizing: border-box">
              <span style="{{r.stateStyle}}"><sc-if value="{{r.dot}}"><span aria-hidden="true" style="{{r.dot}}"></span></sc-if>{{r.state}}</span>
              <span style="font-weight: 500; line-height: 1.4">{{r.title}}</span>
              <span style="font-size: 12px; color: #6E6E76; margin-top: auto">{{r.meta}}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // 原型：发送后进入一个新会话（运行中）
    document.addEventListener('kits-send', () => { location.href = 'session.html?s=streaming'; });
  }
  renderVals() {
    const dot = (c, pulse) => 'width: 7px; height: 7px; border-radius: 50%; background: ' + c + (pulse ? '; animation: k-pulse 1.4s ease-in-out infinite' : '');
    const state = (c) => 'display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: ' + c;
    return {
      suggestions: [
        ['改代码', '给兑换接口加幂等校验，跑一下 tests/points'],
        ['排查', '昨晚 CI 的 test_refund 为什么挂了'],
        ['问答', '会员等级是怎么升降的，指出对应代码'],
        ['写文档', '给 points 模块补一份接口文档']
      ].map(([kind, text]) => ({ kind, text, pick: () => window.kitsFill('home', text) })),
      recent: [
        { href: 'session.html?s=permission', state: '有命令等你确认', stateStyle: state('#B4650A'), dot: dot('#B4650A'), title: '给兑换接口加幂等校验', meta: 'member-svc · 12 分钟前' },
        { href: 'session.html?s=question', state: 'Agent 有个问题', stateStyle: state('#B4650A'), dot: dot('#B4650A'), title: '排查订单退款超时', meta: 'order-svc · 刚刚' },
        { href: 'session.html?s=done', state: '已完成 · 改了 3 个文件', stateStyle: state('#6E6E76'), dot: '', title: '优惠券过期任务为什么没跑', meta: 'points-web · 昨天' }
      ]
    };
  }
}
</script>
</body>
</html>
