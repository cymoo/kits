<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>kits</title>
<script src="./runtime.js"></script>
<script src="./theme.js"></script>
<script src="./shell.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F2}
a{color:#3659E3}a:hover{color:#2744B8}
.k-sug:hover{border-color:#C9C8C1;background:#FFFFFF}
</style>
</helmet>
<div style="height: 100vh; display: flex; font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #1B1B1F; font-size: 14px; line-height: 1.5; background: #F6F5F2; overflow: hidden">

  <k-nav active="new"></k-nav>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 0 32px; box-sizing: border-box">
    <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 28px; margin: auto 0; padding: 48px 0 12vh; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.015em">要做什么？</h1>
        <p style="margin: 0; color: #6E6E76">在 <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #1B1B1F">member-svc</span> 里干活。输入 / 用命令，@ 引用文件、需求或用例。</p>
      </div>

      <k-composer key="home" rows="3" big placeholder="描述任务。例如：给积分兑换接口加幂等校验，改完跑 tests/points 下的测试"></k-composer>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
        <sc-for list="{{suggestions}}" as="g">
          <button type="button" onClick="{{g.pick}}" class="k-sug" style="height: 32px; padding: 0 12px; border: 1px solid #E5E4DF; border-radius: 16px; background: transparent; font: inherit; font-size: 13.5px; color: #4A4A52; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><span style="color: #9A9AA1">{{g.kind}}</span>{{g.text}}</button>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // 原型：发送后进入一个新会话（运行中）
    document.addEventListener('kits-send', () => { location.href = 'session.html?s=streaming'; });
  }
  renderVals() {
    return {
      suggestions: [
        ['改代码', '给兑换接口加幂等校验，跑一下 tests/points'],
        ['排查', '昨晚 CI 的 test_refund 为什么挂了'],
        ['问答', '会员等级是怎么升降的，指出对应代码'],
        ['写文档', '给 points 模块补一份接口文档']
      ].map(([kind, text]) => ({ kind, text, pick: () => window.kitsFill('home', text) }))
    };
  }
}
</script>
</body>
</html>
