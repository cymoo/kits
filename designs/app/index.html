<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>kits</title>
<script src="./runtime.js"></script>
<script src="./theme.js"></script>
<script src="./shell.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F9F9F8}
a{color:#3563E0}a:hover{color:#2A4FBF}
.k-sug:hover{border-color:#CFCFCB;background:#FFFFFF}
</style>
</helmet>
<div style="height: 100vh; display: flex; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; color: #16171A; font-size: 14px; line-height: 22px; background: #F9F9F8; overflow: hidden">

  <k-nav active="new"></k-nav>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 0 32px; box-sizing: border-box">
    <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 28px; margin: auto 0; padding: 48px 0 12vh; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
        <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.015em">要做什么？</h1>
      </div>

      <k-composer key="home" rows="3" big placeholder="发消息或创建测试任务，/ 调用指令，@ 引用文件"></k-composer>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
        <sc-for list="{{suggestions}}" as="g">
          <button type="button" onClick="{{g.pick}}" class="k-sug" style="height: 32px; padding: 0 12px; border: 1px solid #E8E8E5; border-radius: 16px; background: transparent; font: inherit; font-size: 13px; color: #43464C; cursor: pointer; display: inline-flex; align-items: center; gap: 6px"><span style="color: #A0A3A9">{{g.kind}}</span>{{g.text}}</button>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // 原型：发送后进入一个新会话（运行中）
    document.addEventListener('kits-send', () => { location.href = 'session.html?s=streaming'; });
  }
  renderVals() {
    return {
      suggestions: [
        ['改代码', '给兑换接口加幂等校验，跑一下 tests/points'],
        ['排查', '昨晚 CI 的 test_refund 为什么挂了'],
        ['问答', '会员等级是怎么升降的，指出对应代码'],
        ['写文档', '给 points 模块补一份接口文档']
      ].map(([kind, text]) => ({ kind, text, pick: () => window.kitsFill('home', text) }))
    };
  }
}
</script>
</body>
</html>
