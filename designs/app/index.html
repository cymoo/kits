<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>kits</title>
<script src="./runtime.js"></script>
<script src="./shell.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.h-sug{height:32px;padding:0 12px;border:1px solid #ECECE8;border-radius:16px;background:#FFFFFF;font:inherit;font-size:13px;color:#52525B;cursor:pointer;transition:border-color .12s,color .12s}
.h-sug:hover{border-color:#C9C9C3;color:#18181B}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; color: #18181B; font-size: 13px; line-height: 1.5; background: #FFFFFF">

  <k-nav active="new"></k-nav>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 0 24px; box-sizing: border-box">
    <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 20px; margin: 26vh 0 48px">
      <h1 style="margin: 0 0 4px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; text-align: center">要做什么？</h1>
      <k-composer key="home" rows="3" placeholder="描述任务，@ 引用需求、用例或文件"></k-composer>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
        <sc-for list="{{suggestions}}" as="g">
          <button type="button" class="h-sug" onClick="{{g.pick}}">{{g.text}}</button>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // 原型：和测试有关的任务进入测试任务页，其他进入普通会话
    document.addEventListener('kits-send', (e) => {
      const text = e.detail.text;
      location.href = /测试|用例|回归|冒烟|失败|R-\d+/.test(text) ? 'task.html?q=' + encodeURIComponent(text) : 'session.html';
    });
  }
  renderVals() {
    return {
      suggestions: [
        '为需求 R-1024 设计用例并执行',
        '跑一遍积分模块回归，分析失败原因',
        '分析昨晚 CI 的失败'
      ].map((text) => ({ text, pick: () => window.kitsFill('home', text) }))
    };
  }
}
</script>
</body>
</html>
