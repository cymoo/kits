<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首次引导</title>
<script src="./runtime.js"></script>
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F9F9F8}
a{color:#3563E0}a:hover{color:#2A4FBF}
.k-ghost:hover{background:#F1F1EE}
.k-in:focus{outline:none;border-color:#3563E0;box-shadow:0 0 0 3px rgba(53,99,224,.15)}
@keyframes k-spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; color: #16171A; font-size: 14px; line-height: 22px; background: #F9F9F8">

  <header style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 24px; box-sizing: border-box">
    <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: #16171A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">k</span>
    <span style="font-weight: 650; font-size: 16px; letter-spacing: -0.01em">kits</span>
  </header>

  <main style="flex: 1; display: flex; justify-content: center; padding: 24px 24px 48px; box-sizing: border-box">
    <section aria-live="polite" style="width: 100%; max-width: 560px; align-self: flex-start; background: #FFFFFF; border: 1px solid #E8E8E5; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 32px rgba(0,0,0,.04); display: flex; flex-direction: column">
      <div style="padding: 28px 32px 8px; display: flex; flex-direction: column; gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">开始使用 kits</h1>
          <p style="margin: 0; color: #60646B">配好模型就能开始。这些以后都能在“设置”里改，数据只存在本机。</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <h2 style="margin: 0; font-size: 15px; font-weight: 600">模型网关</h2>
            <p style="margin: 0; font-size: 13px; color: #60646B">kits 通过 LLM 网关（OpenAI 兼容接口）调用模型，不直连外网。</p>
          </div>
          <sc-if value="{{untested}}">
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
              <label style="display: flex; flex-direction: column; gap: 6px">
                <span style="font-weight: 500">网关地址</span>
                <input class="k-in" type="url" placeholder="https://…/v1" style="height: 36px; padding: 0 12px; border: 1px solid #E8E8E5; border-radius: 8px; font: inherit; font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; color: #16171A; background: #FFFFFF; box-sizing: border-box; width: 100%">
              </label>
              <label style="display: flex; flex-direction: column; gap: 6px">
                <span style="font-weight: 500">API Key</span>
                <input class="k-in" type="password" style="height: 36px; padding: 0 12px; border: 1px solid #E8E8E5; border-radius: 8px; font: inherit; font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; color: #16171A; background: #FFFFFF; box-sizing: border-box; width: 100%">
                <span style="font-size: 13px; color: #60646B">存在系统钥匙串，不写进配置文件</span>
              </label>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
              <button type="button" onClick="{{test}}" class="k-ghost" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid #DCDCD8; border-radius: 8px; background: #FFFFFF; font: inherit; font-weight: 500; color: #16171A; cursor: pointer">
                <sc-if value="{{testing}}"><span aria-hidden="true" style="width: 12px; height: 12px; border: 2px solid #DCDCD8; border-top-color: #3563E0; border-radius: 50%; animation: k-spin .8s linear infinite; box-sizing: border-box"></span></sc-if>
                {{testLabel}}
              </button>
              <span style="font-size: 13px; color: #60646B">只列一下模型，不发对话请求</span>
            </div>
          </sc-if>
          <sc-if value="{{tested}}">
            <div style="display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#1E7F43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"></path></svg><span style="font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px">https://llm-gateway.corp.example/v1</span><span style="font-size: 13px; color: #1E7F43">已连接 · 3 个模型</span></div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span style="font-weight: 500">默认模型</span>
              <div role="radiogroup" aria-label="默认模型" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                <sc-for list="{{models}}" as="m">
                  <button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}"><span style="font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 500">{{m.id}}</span><span style="{{m.tickStyle}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"></path></svg></span></button>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <h2 style="margin: 0; font-size: 15px; font-weight: 600">工作区</h2>
            <p style="margin: 0; font-size: 13px; color: #60646B">Agent 只在这里读写文件，目录以外的操作要先问你。</p>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #E8E8E5; border-radius: 12px">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#60646B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto"><path d="M2 4.5h4l1.5 1.5H14v7H2z"></path></svg>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1"><span style="font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 14px; font-weight: 500">{{dir}}</span><span style="font-size: 13px; color: #60646B">{{dirNote}}</span></span>
            <button type="button" onClick="{{pickDir}}" class="k-ghost" style="height: 30px; padding: 0 10px; border: 1px solid #E8E8E5; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 13px; color: #16171A; cursor: pointer">{{dirAction}}</button>
          </div>
        </div>
      </div>

      <footer style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 32px 20px; border-top: 1px solid #F2F2F0; margin-top: 8px">
        <a href="index.html" class="k-ghost" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; color: #60646B; text-decoration: none">先跳过</a>
        <a href="index.html" style="{{startStyle}}">开始使用</a>
      </footer>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { test: 'idle', model: 'coder-main', picked: false };
  }
  renderVals() {
    const s = this.state;
    const models = ['coder-main', 'coder-fast', 'reasoner-pro'].map((id) => {
      const on = s.model === id;
      return { id, on, pick: () => this.setState({ model: id }),
        style: 'display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid ' + (on ? '#3563E0' : '#E8E8E5') + '; border-radius: 12px; background: ' + (on ? '#F1F4FF' : '#FFFFFF') + '; font: inherit; color: #16171A; cursor: pointer',
        tickStyle: 'margin-left: auto; color: #3563E0; ' + (on ? '' : 'visibility: hidden') };
    });
    const ready = s.test === 'ok';
    return {
      testing: s.test === 'testing', tested: ready, untested: !ready,
      testLabel: s.test === 'testing' ? '正在连接…' : '测试连接',
      test: () => { this.setState({ test: 'testing' }); setTimeout(() => this.setState({ test: 'ok' }), 900); },
      models,
      dir: s.picked ? '~/repo/member-svc' : '~/kits-workspace',
      dirNote: s.picked ? 'Git 仓库 · main 分支 · 工作区干净' : '开始时自动创建，新建会话时还能换',
      dirAction: s.picked ? '换一个' : '选择已有目录',
      pickDir: () => this.setState({ picked: !s.picked }),
      startStyle: 'display: inline-flex; align-items: center; height: 36px; padding: 0 18px; border-radius: 8px; background: #16171A; font-weight: 500; color: #FFFFFF; text-decoration: none; ' + (ready ? '' : 'opacity: .35; pointer-events: none')
    };
  }
}
</script>
</body>
</html>
