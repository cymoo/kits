# 打包（phase1-implementation PR20）：mac dmg（arm64 / x64）、win nsis（x64）。
# 先跑 pnpm vendor:kernel 把当前平台的内核拷到 vendor/（OpenCode 来自 npm；CodeAgent 来自 KITS_CODEAGENT_BIN，没有就不带）。
# 签名和公证：证书到位后只改这里的 mac.identity / mac.hardenedRuntime / win.signtoolOptions 和 CI 的密钥（见 README“打包和发布”）。
appId: dev.kits.desktop
productName: kits
copyright: Copyright © 2026 kits
directories:
  output: release
  # 应用图标 icon.png（1024×1024）在这里，electron-builder 自己转成 icns / ico
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  # 内核二进制按平台放进 resources/bin/，不进 asar（asar 里的文件不能执行）
  - from: ../../vendor/opencode/${os}-${arch}
    to: bin/opencode
  # CodeAgent 不在 npm 上：vendor 里有就带上，没有设置页会显示“未安装”和安装说明
  - from: ../../vendor/codeagent/${os}-${arch}
    to: bin/codeagent
    filter: ["**/*"]
  # 内核的 grep、glob 要用 ripgrep，内网下载不了，随包带一份（third_party/ripgrep 没有这个平台时是空目录）
  - from: ../../vendor/ripgrep/${os}-${arch}
    to: bin/ripgrep
    filter: ["**/*"]
  # 数据库迁移、内置 Agent 和技能、托盘图标
  - from: drizzle
    to: drizzle
  - from: resources/builtin
    to: builtin
  - from: resources/tray
    to: tray
asar: true
# vendor/ 里没有目标平台的内核时直接失败，不打出没有内核的包；
# 再从 CHANGELOG.md 取出这个版本的一节写成 resources/release-notes.md，electron-builder 放进 latest.yml 的 releaseNotes
beforePack: ./scripts/before-pack.mjs
mac:
  category: public.app-category.developer-tools
  # 架构由命令行定（--arm64 / --x64，不给就是本机的）：每个架构的内核要在对应的机器上 vendor，CI 里两种 mac 各跑一台
  target:
    - dmg
    # 自动更新在 mac 上用 zip
    - zip
  # 没有证书时用 ad-hoc 签名：不签的话 .app 的签名封印是坏的，codesign 校验不过，别的 Mac 上可能打不开。
  # 证书到位后删掉 identity，hardenedRuntime 改 true（公证要求），再打开 notarize
  identity: "-"
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: kits-${version}-mac-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: kits-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
# 便携版（pnpm package:portable）：单个 exe，不用安装。文件名和安装包分开，两种放同一个目录不互相覆盖
# 脚本用 --config.electronDist 指到 node_modules 里的 Electron，打包不连 GitHub；这个目录是本机平台的，所以只能在 Windows x64 上跑
portable:
  artifactName: kits-${version}-win-${arch}-portable.${ext}
  # 每次启动解压到各自的临时目录。默认目录是构建时定死的，启动前还要先清空：再双击一次会删掉运行中实例的文件。
  # 文档写的是 false，但 electron-builder 26 的代码里只有 true 才走这条路
  unpackDirName: true
publish:
  # 内网更新：放一个静态目录即可（Jenkins 的 userContent 也行）。这里的 url 会写进安装包的 app-update.yml，
  # 是客户端的默认更新地址：内网 CI 打包时用 -c.publish.url=<地址> 换成真实地址，内网地址不写进仓库。
  # 运行时 KITS_UPDATE_URL、settings.json 的 updateUrl 优先（main/updater.ts）；占位地址 updates.invalid 当作没配。
  # CI 打包用 --publish never，electron-builder 不往这个地址传，发布由 CI 自己拷文件
  provider: generic
  url: https://updates.invalid/kits
