# 打包（phase1-implementation PR20）：mac dmg（arm64 / x64）、win nsis（x64）。
# 先跑 pnpm vendor:kernel 把当前平台的内核拷到 vendor/（OpenCode 来自 npm；CodeAgent 来自 KITS_CODEAGENT_BIN，没有就不带）。
# 签名和公证：证书到位后只改这里的 mac.identity / mac.hardenedRuntime / win.signtoolOptions 和 CI 的密钥（见 README“打包和发布”）。
appId: dev.kits.desktop
productName: kits
copyright: Copyright © 2026 kits
directories:
  output: release
  # 应用图标 icon.png（1024×1024）在这里，electron-builder 自己转成 icns / ico
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  # 内核二进制按平台放进 resources/bin/，不进 asar（asar 里的文件不能执行）
  - from: ../../vendor/opencode/${os}-${arch}
    to: bin/opencode
  # CodeAgent 不在 npm 上：vendor 里有就带上，没有设置页会显示“未安装”和安装说明
  - from: ../../vendor/codeagent/${os}-${arch}
    to: bin/codeagent
    filter: ["**/*"]
  # 数据库迁移、内置 Agent 和技能、托盘图标
  - from: drizzle
    to: drizzle
  - from: resources/builtin
    to: builtin
  - from: resources/tray
    to: tray
asar: true
# vendor/ 里没有目标平台的内核时直接失败，不打出没有内核的包
beforePack: ./scripts/check-kernel.mjs
mac:
  category: public.app-category.developer-tools
  # 架构由命令行定（--arm64 / --x64，不给就是本机的）：每个架构的内核要在对应的机器上 vendor，CI 里两种 mac 各跑一台
  target:
    - dmg
    # 自动更新在 mac 上用 zip
    - zip
  # 没有证书时用 ad-hoc 签名：不签的话 .app 的签名封印是坏的，codesign 校验不过，别的 Mac 上可能打不开。
  # 证书到位后删掉 identity，hardenedRuntime 改 true（公证要求），再打开 notarize
  identity: "-"
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: kits-${version}-mac-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: kits-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
# 便携版（pnpm package:portable）：单个 exe，不用安装。文件名和安装包分开，两种放同一个目录不互相覆盖
# 脚本用 --config.electronDist 指到 node_modules 里的 Electron，打包不连 GitHub；这个目录是本机平台的，所以只能在 Windows x64 上跑
portable:
  artifactName: kits-${version}-win-${arch}-portable.${ext}
publish:
  # 内网更新：放一个静态目录即可。运行时的地址以 settings.json 的 updateUrl 或 KITS_UPDATE_URL 为准（main/updater.ts），
  # 这里只决定 latest.yml 等元数据文件怎么生成；CI 打包用 --publish never，不往这个地址传
  provider: generic
  url: https://updates.invalid/kits
